version: '3.9'

services:

  db:
    image: postgres:16-alpine
    container_name: users_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-usersdb}
      POSTGRES_USER: ${POSTGRES_USER:-usersdb_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-usersdb_user} -d ${POSTGRES_DB:-usersdb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: users_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-usersdb}
      DB_USERNAME: ${POSTGRES_USER:-usersdb_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
