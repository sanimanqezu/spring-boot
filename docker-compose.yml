services:
  app:
    build: .
    container_name: users_app
    environment:
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      DB_HOST: postgres
      DB_PORT: '5432'
    ports:
    - 8080:8080
    restart: unless-stopped
    networks:
    - portfolio-net
networks:
  portfolio-net:
    external: true
