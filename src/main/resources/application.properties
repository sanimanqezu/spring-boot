server.port=8080
spring.application.name=spring-boot-users

# PostgreSQL datasource — values supplied via environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/usersdb}
spring.datasource.username=${DB_USERNAME:usersdb_user}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Logging
logging.level.root=INFO
logging.level.za.co.example=DEBUG
logging.level.org.springframework.security=WARN

# SpringDoc / Swagger UI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
